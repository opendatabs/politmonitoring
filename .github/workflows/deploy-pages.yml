name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angular/package-lock.json

      # `npm ci` is not used because package-lock.json is not fully in sync
      # with package.json yet.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Static build: data is fetched directly from data.bs.ch (see
      # src/environments/environment.pages.ts). base-href is the Pages path,
      # e.g. /politmonitoring/
      - name: Build
        run: >
          npx ng build
          --configuration production,pages
          --output-path ../pages-out
          --base-href "${{ steps.pages.outputs.base_path }}/"

      # Serve index.html for unknown paths so client-side routes (e.g. /home)
      # also work on reload
      - name: SPA fallback
        run: cp ../pages-out/index.html ../pages-out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
